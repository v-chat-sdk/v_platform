name: v_platform
description: Cross-platform Flutter file metadata, serialization, MIME detection, and multipart upload utilities.
version: 3.0.0
homepage: https://github.com/v-chat-sdk/v_platform
repository: https://github.com/v-chat-sdk/v_platform
issue_tracker: https://github.com/v-chat-sdk/v_platform/issues

topics:
  - file
  - upload
  - mime
  - cross-platform

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  crypto: ^3.0.8
  file_sizes: ^1.0.6
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
