name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test package
        run: >-
          flutter test --branch-coverage --no-pub
          --test-randomize-ordering-seed=random

      - name: Test browser compatibility
        run: >-
          flutter test --platform chrome --no-pub
          --test-randomize-ordering-seed=random
          test/platforms_test.dart
          test/web_compatibility_test.dart

      - name: Test WASM compatibility
        run: >-
          flutter test --platform chrome --wasm --no-pub
          --test-randomize-ordering-seed=random
          test/platforms_test.dart
          test/web_compatibility_test.dart

      - name: Test example
        working-directory: example
        run: >-
          flutter test --no-pub
          --test-randomize-ordering-seed=random

      - name: Build example for Android
        working-directory: example
        run: flutter build apk --debug --no-pub

      - name: Build example for WASM
        working-directory: example
        run: flutter build web --wasm --no-pub

      - name: Validate package archive
        run: flutter pub publish --dry-run

  apple-builds:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example for iOS simulator
        working-directory: example
        run: flutter build ios --simulator --no-pub

      - name: Build example for macOS
        working-directory: example
        run: flutter build macos --debug --no-pub
